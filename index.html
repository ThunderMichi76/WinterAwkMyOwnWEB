<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Winter Arc</title><meta name="theme-color" content="#08090A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Winter Arc - Rastreador de hábitos, disciplina y objetivos diarios">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2308090A'/%3E%3Ccircle cx='50' cy='50' r='24' fill='none' stroke='%235E8BFF' stroke-width='7' stroke-dasharray='110 41' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f7f6f3;--card:#fff;--fg:#1d2321;--mut:#7a827e;--line:#e6e4de;--ac:#3d6b5c;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#121413;--card:#1b1d1c;--fg:#e8ebe9;--mut:#8b9490;--line:#2b2f2d;--ac:#7fb3a0;--on:#10201a}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 110px}
h2{margin:0;font-size:1.35rem;font-weight:600}h3{margin:0 0 12px;font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.muted,small{color:var(--mut)}small{margin-left:8px;font-size:.78rem}
button{font:inherit;color:inherit;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:16px 0;color:var(--mut)}nav button.on{color:var(--ac);font-weight:600}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px}
.ring{width:84px;height:84px;position:relative;flex:none}.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.1rem}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:.8rem;color:var(--mut);margin-top:6px}
.pill.valid{background:var(--ac);color:var(--on);border-color:var(--ac)}.pill.saved{border-color:var(--ac);color:var(--ac);border-style:dashed}.pill.skip{border-color:#5AC8FA;color:#5AC8FA;background:rgba(90,200,250,.12)}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:8px 2px;border:0;background:none;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row i{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;transition:.2s}
.row.on i{background:var(--ac);border-color:var(--ac);animation:pop .25s}.row.on span{color:var(--mut)}
@keyframes pop{50%{transform:scale(1.2)}}
.sw{display:flex;gap:10px;align-items:center}.sw button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:10px 18px}.sw button[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac)}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 10px}
textarea{resize:vertical}label{display:block;font-size:.85rem;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.g3{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:0 8px}
.btn{border:1px solid var(--ac);background:var(--ac);color:var(--on);border-radius:12px;padding:12px 16px}.btn.o{background:none;color:var(--ac)}
.chips{display:flex;gap:8px;margin-bottom:8px}.chips button{border:1px solid var(--line);background:none;border-radius:99px;padding:8px 14px}
.lnk{border:0;background:none;color:var(--ac);padding:0}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}.tl li{display:flex;gap:12px;padding:6px 0;position:relative;color:var(--mut)}
.tl li:before{content:"";position:absolute;left:-20px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.tl li.now{color:var(--fg);font-weight:600}.tl li.now:before{background:var(--ac)}.tl b{min-width:44px;font-weight:500}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0}.x{border:0;background:none;font-size:1.3rem;color:var(--mut);padding:4px 10px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}td,th{text-align:center;padding:4px 2px}td:first-child{text-align:left;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.cell{width:34px;height:34px;border-radius:9px;border:2px solid var(--line);background:none}.cell.on{background:var(--ac);border-color:var(--ac)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--line)}.dot.valid{background:var(--ac)}.dot.saved{border:2px dashed var(--ac);background:none}.dot.miss{background:var(--mut);opacity:.5}.dot.skip{background:none;border:2px solid #5AC8FA}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.note{padding:12px 14px;border-radius:14px;border:1px solid var(--ac);margin:14px 0}.note.w{border-style:dashed}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar div{height:100%;background:var(--ac)}
svg.ch{width:100%;height:auto}.ch rect{fill:var(--line)}.ch rect.valid{fill:var(--ac)}.ch rect.saved{fill:none;stroke:var(--ac);stroke-dasharray:3}.ch .ln{stroke:var(--mut);stroke-dasharray:3;fill:none}.ch .pl{stroke:var(--ac);fill:none;stroke-width:2}.ch circle{fill:var(--ac)}.ch text{fill:var(--mut);font-size:8px}
.big{font-size:2.2rem;font-weight:600}

/* ===== v2: sistema de diseño, menú lateral, panel ===== */
:root{--ok:#2f9e6b;--warn:#d9922b;--err:#d1495b;--sw:76px;--sh:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);--font:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
:root[data-theme=light]{--bg:#f7f6f3;--card:#fff;--fg:#1d2321;--mut:#7a827e;--line:#e6e4de;--ac:#3d6b5c;--on:#fff}
:root[data-theme=dark]{--bg:#121413;--card:#1b1d1c;--fg:#e8ebe9;--mut:#8b9490;--line:#2b2f2d;--ac:#7fb3a0;--on:#10201a}
body{font-family:var(--font);padding-left:var(--sw)}
main{max-width:980px;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card{box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}@media(hover:hover){.card:hover{transform:translateY(-1px)}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
aside{position:fixed;left:0;top:0;bottom:0;width:var(--sw);display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line);z-index:5}
aside .top{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:center}
.ib{border:1px solid var(--line);background:none;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--fg)}
#days{flex:1;overflow-y:auto;padding:6px}
.day{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;min-height:44px;border:1px solid transparent;border-radius:12px;background:none;margin-bottom:2px;font-size:.8rem;color:var(--mut);transition:background .15s}
.day b{font-weight:600;color:var(--fg)}.day em,.s3{display:none;font-style:normal}
.day:hover{background:var(--bg)}.day.sel{background:var(--ac);color:var(--on)}.day.sel b{color:var(--on)}.day.today:not(.sel){border-color:var(--ac)}
.day i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mut);flex:none}
.day i.valid{background:var(--ok);border-color:var(--ok)}.day i.part{background:var(--warn);border-color:var(--warn)}.day i.saved{border:1.5px dashed var(--ac)}.day i.skip{background:none;border:1.5px solid #5AC8FA}.day i.miss{background:var(--mut);opacity:.5}
.day.sel i{box-shadow:0 0 0 2px var(--on)}
@media(min-width:760px){:root{--sw:176px}.day{justify-content:flex-start;padding:0 12px}.day em,.s3{display:inline}.s1{display:none}.day i{margin-left:auto}}
nav{left:var(--sw)}nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;font-size:.75rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kpi{margin:0;display:flex;flex-direction:column;gap:2px}.kpi b{font-size:1.7rem;font-weight:600}
.up{color:var(--ok)}.dn{color:var(--err)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.grid .card{margin:0}.wide{grid-column:1/-1}
.cv{position:relative;height:230px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;overflow-x:auto;padding:3px}.hm i{border-radius:3px}
@media(max-width:759px){main{padding:14px 10px 100px}.head h2{font-size:1rem}.cell{width:25px;height:25px;border-radius:7px}td:first-child{max-width:62px;font-size:.72rem}td,th{padding:3px 1px}}

/* ===== v3: estética tipo app iOS (inspirada en Strides) ===== */
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;--r:20px;--sh:none}
:root[data-theme=light]{--bg:#F2F2F7;--card:#fff;--fg:#1C1C1E;--mut:#8E8E93;--line:rgba(60,60,67,.14);--ac:#0A84FF;--on:#fff}
:root[data-theme=dark]{--bg:#000;--card:#1C1C1E;--fg:#fff;--mut:#98989F;--line:rgba(255,255,255,.14);--ac:#0A84FF;--on:#fff}
.card{border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);padding:18px}
h2{font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 12px}.sh h2{margin:0}
.btn,.pill{border-radius:999px;transition:transform .2s,background .2s}.btn:active,.pill:active{transform:scale(.97)}
.pill{border:0;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);padding:10px 16px;font-weight:600}
.pill.on{background:var(--ac);color:var(--on)}.pill:disabled{opacity:.4;cursor:default}
.chip{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.goal{margin:0;display:flex;flex-direction:column;gap:10px}
.gh{display:flex;gap:12px;align-items:center}.gh b{display:block}.gh small{margin:0}
.gn{font-size:2.2rem;font-weight:700;line-height:1;letter-spacing:-.02em}.gn .muted{font-size:1rem;font-weight:500}
.bar{height:8px}.bar div{background:var(--c,var(--ac));animation:fill .8s cubic-bezier(.2,.8,.2,1);transition:width .3s}@keyframes fill{from{width:0}}
.gf{display:flex;align-items:center;gap:10px}.fl{display:flex;align-items:center;gap:4px;color:#FF9F0A;font-weight:600}.fl svg{width:16px;height:16px}.sp{width:70px;height:20px;margin-left:auto}
.kpi b{color:var(--c,var(--fg))}.seg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.seg>span{font-weight:600}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dr{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:14px}.dr:hover{background:var(--bg)}.dr b{font-size:.8rem}.dr small{margin:0}
.sum{font-size:1.02rem}.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.day.sel{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}.day.sel b{color:var(--ac)}.day.sel i{box-shadow:none}
.row.on i{background:var(--c,var(--ac));border-color:var(--c,var(--ac))}.cell.on{background:var(--ac);border-color:var(--ac)}
.kw{grid-template-columns:repeat(2,1fr)}@media(min-width:760px){.kw{grid-template-columns:repeat(3,1fr)}}
/* ===== v3.0: RANGOS, BADGES, REST TIMER, HABIT EDITOR, QUOTE, GHOST MODE, MODALS ===== */
.rank-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:color-mix(in srgb,var(--ac) 12%,transparent);border:1px solid color-mix(in srgb,var(--ac) 28%,transparent);font-size:.82rem;font-weight:600;color:var(--ac);margin-top:8px}
.rank-bar{width:60px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.rank-bar i{display:block;height:100%;background:var(--ac);border-radius:2px}
.top-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.top-toolbar .group{display:flex;gap:6px;align-items:center}
.btn-sm{padding:6px 12px;font-size:.78rem;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.btn-sm:hover{background:var(--bg)}
.quote-card{padding:14px 16px;border-left:3px solid var(--ac);background:var(--card);border-radius:14px;margin:12px 0;font-style:italic;position:relative}
.quote-card b{display:block;font-style:normal;font-size:.78rem;color:var(--mut);margin-top:4px;text-align:right}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.badge-item{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 8px;border-radius:16px;border:1px solid var(--line);background:var(--card);gap:6px;transition:.2s}
.badge-item.locked{opacity:.4;filter:grayscale(1)}
.badge-item .b-icon{font-size:1.8rem}
.badge-item b{font-size:.8rem}
.badge-item small{font-size:.7rem;color:var(--mut)}
.timer-box{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--ac) 8%,transparent);border:1px dashed var(--ac);margin:10px 0}
.timer-digits{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ac)}
.timer-acts{display:flex;gap:6px}
.h-editor-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.h-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);gap:10px}
.h-meta{display:flex;align-items:center;gap:10px;flex:1}
.h-color-circle{width:16px;height:16px;border-radius:50%;flex:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;animation:in .2s}
.modal-card{background:var(--card);border-radius:22px;border:1px solid var(--line);max-width:520px;width:100%;max-height:90vh;overflow-y:auto;padding:22px;position:relative;box-shadow:0 12px 36px rgba(0,0,0,.25)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.strength-badge{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--ac)) 14%,transparent);color:var(--c,var(--ac));font-weight:600}
body.ghost main{max-width:540px}
body.ghost aside,body.ghost nav,body.ghost #theme{display:none!important}
body.ghost{padding-left:0}
#confetti-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999}
/* ===== HOJA DE CÁLCULO (SPREADSHEET VIEW) ===== */
.sheet-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0;margin:16px 0;overflow:hidden;box-shadow:var(--sh)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--card) 95%,var(--fg) 5%);gap:10px;flex-wrap:wrap}
.sheet-title{display:flex;align-items:center;gap:12px}
.sheet-icon{font-size:1.4rem}
.sheet-title h3{margin:0;font-size:1rem;font-weight:700;color:var(--fg);text-transform:none;letter-spacing:normal}
.sheet-title p{margin:2px 0 0;font-size:.76rem;color:var(--mut)}
.sheet-actions{display:flex;gap:6px;align-items:center}
.btn-xs{padding:5px 10px;font-size:.74rem;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--fg);transition:.15s}
.btn-xs:hover{background:var(--bg);border-color:var(--ac)}
.sheet-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sheet-table{width:100%;border-collapse:collapse;font-size:.85rem;text-align:left}
.sheet-table thead th{background:color-mix(in srgb,var(--card) 88%,var(--fg) 12%);color:var(--mut);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.sheet-table tbody tr{border-bottom:1px solid var(--line);transition:background .15s}
.sheet-table tbody tr:hover{background:color-mix(in srgb,var(--card) 94%,var(--ac) 6%)}
.sheet-table tbody tr.row-done{background:color-mix(in srgb,var(--card) 94%,#30D158 6%)}
.sheet-table tbody tr.row-done td.td-strike{text-decoration:line-through;opacity:.6}
.sheet-table td{padding:9px 12px;vertical-align:middle;border-right:1px solid color-mix(in srgb,var(--line) 40%,transparent)}
.sheet-table td:last-child{border-right:none}
.sheet-table tfoot{background:color-mix(in srgb,var(--card) 96%,var(--fg) 4%);border-top:2px solid var(--line)}
.sheet-table tfoot td{padding:8px 10px}
.sheet-input,.sheet-select{width:100%;padding:7px 10px;font:inherit;font-size:.82rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin:0}
.sheet-input:focus,.sheet-select:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 20%,transparent)}
.btn-sheet-add{padding:7px 12px;font-size:.78rem;font-weight:600;border-radius:8px;background:var(--ac);color:var(--on);border:none;cursor:pointer;white-space:nowrap;transition:.15s}
.btn-sheet-add:hover{filter:brightness(1.1)}
.sheet-chk-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);background:none;cursor:pointer;transition:.15s;color:transparent;font-size:.9rem;font-weight:700}
.sheet-chk-btn.on{background:var(--c,var(--ac));border-color:var(--c,var(--ac));color:#fff}
.sheet-cat-badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:.7rem;font-weight:600;white-space:nowrap}
.strength-mini-bar{width:44px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:inline-block}
.strength-mini-bar i{display:block;height:100%;border-radius:3px}
.sheet-time{font-family:monospace;font-size:.88rem;font-weight:600}
.pill-now{display:inline-block;padding:1px 5px;border-radius:4px;font-size:.65rem;font-weight:700;background:var(--ac);color:var(--on);margin-left:6px;vertical-align:middle;animation:pulseNow 2s infinite}
@keyframes pulseNow{0%,100%{opacity:1}50%{opacity:.6}}
.cat-rutina{background:rgba(255,159,10,.14);color:#FF9F0A}
.cat-estudio{background:rgba(10,132,255,.14);color:#0A84FF}
.cat-entreno{background:rgba(255,69,58,.14);color:#FF453A}
.cat-trabajo{background:rgba(191,90,242,.14);color:#BF5AF2}
.cat-salud{background:rgba(48,209,88,.14);color:#30D158}
.cat-descanso{background:rgba(90,200,250,.14);color:#5AC8FA}
.cat-otros{background:rgba(142,142,147,.14);color:var(--mut)}
.mode-toggle{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px}
.mode-btn{padding:5px 12px;font-size:.76rem;border-radius:99px;border:none;background:none;color:var(--mut);cursor:pointer;transition:.15s}
.mode-btn.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.toast-msg{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1d2321;color:#fff;padding:9px 18px;border-radius:99px;font-size:.82rem;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:99999;animation:toastIn .2s ease-out;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
/* ===== TIRA DE CALENDARIO DEL DÍA ===== */
.day-cal-strip{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:12px 0;box-shadow:var(--sh)}

 transition:opacity .6s var(--ease),transform .6s var(--ease);animation:i-failsafe 0s 6s forwards}
#intro.out{opacity:0;transform:scale(1.04);pointer-events:none}
#intro .logo{width:88px;height:88px;overflow:visible;animation:i-pop calc(.8s*var(--k,1)) var(--ease) backwards}                         /* 0.0-0.8 s icono */
#intro .arc{fill:none;stroke:var(--intro-accent);stroke-width:7;stroke-linecap:round;stroke-dasharray:73 100}
#intro .rg{display:none;fill:none;stroke:var(--intro-accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:100 100}
#intro h1{margin:22px 0 4px;font-size:1.9rem;font-weight:700;letter-spacing:-.02em;animation:i-up calc(.8s*var(--k,1)) calc(.6s*var(--k,1)) var(--ease) backwards}   /* 0.6-1.4 s nombre */
#intro p{margin:0;color:var(--mut);animation:i-up calc(.8s*var(--k,1)) calc(.75s*var(--k,1)) var(--ease) backwards}
#intro .ibar{width:120px;height:2px;margin-top:36px;border-radius:2px;background:var(--line);overflow:hidden;animation:i-fade calc(.5s*var(--k,1)) calc(.9s*var(--k,1)) backwards}
#intro .ibar i{display:block;height:100%;background:var(--intro-accent);transform-origin:left;animation:i-fill calc(.8s*var(--k,1)) calc(1.2s*var(--k,1)) var(--ease) backwards}   /* 1.2-2.0 s barra */
/* botón Entrar: usa el estilo .btn de la web; aparece al terminar la animación (3 s) */
#intro[data-mode=auto]{cursor:pointer}#intro[data-mode=auto] .enter{display:none}
#intro .enter{margin-top:28px;padding:12px 26px;display:inline-flex;align-items:center;gap:8px;font-weight:600;visibility:hidden;opacity:0;transition:transform .2s,filter .2s}
#intro .enter.show{visibility:visible;opacity:1;animation:i-fade .6s var(--ease) backwards,i-pulse 2.8s ease-in-out .8s infinite}   /* fade-in + pulso discreto */
#intro .enter:hover{filter:brightness(1.08)}#intro .enter svg{width:18px;height:18px;transition:transform .2s}#intro .enter:hover svg{transform:translateX(3px)}
@keyframes i-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 35%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
@keyframes i-pop{from{opacity:0;transform:scale(.9)}}@keyframes i-up{from{opacity:0;transform:translateY(12px)}}
@keyframes i-fade{from{opacity:0}}@keyframes i-fill{from{transform:scaleX(0)}}@keyframes i-failsafe{to{opacity:0;visibility:hidden;pointer-events:none}}
/* variantes: data-variant="draw" | "ring" | "blur" en <div id="intro"> */
#intro[data-variant=draw] .logo{animation:none}#intro[data-variant=draw] .arc{animation:i-draw calc(.9s*var(--k,1)) var(--ease) backwards}@keyframes i-draw{from{stroke-dashoffset:73}}
#intro[data-variant=ring] .ibar{display:none}#intro[data-variant=ring] .rg{display:block;animation:i-ring calc(.8s*var(--k,1)) calc(1.2s*var(--k,1)) var(--ease) backwards}@keyframes i-ring{from{stroke-dashoffset:100}}
#intro[data-variant=blur] .logo,#intro[data-variant=blur] .ibar{display:none}#intro[data-variant=blur] h1{font-size:2.4rem;animation:i-blur calc(1.1s*var(--k,1)) var(--ease) backwards}@keyframes i-blur{from{opacity:0;filter:blur(14px)}}
/* la web queda oculta bajo la intro y entra con fade-in; el scroll se bloquea mientras tanto */

const SHOW_INTRO_ALWAYS=true;     // true = en cada carga; false = solo la primera visita de la sesión

const R=document.documentElement,el=document.getElementById('intro'),btn=document.getElementById('intro-enter');

const mode=['button','auto','both'].includes(INTRO_MODE)?INTRO_MODE:'button',reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
el.style.animation='none';el.dataset.mode=mode;                 // desactiva el seguro CSS: el script ha arrancado bien
btn.querySelector('span').textContent=INTRO_BUTTON_TEXT;btn.setAttribute('aria-label',INTRO_BUTTON_TEXT+' a Winter Arc');
R.style.setProperty('--k',INTRO_SPEED);R.classList.add('intro-on');   // bloquea el scroll y oculta la web
let done=false,shown=false,tA,tB;
const finish=()=>{if(done)return;done=true;clearTimeout(tA);clearTimeout(tB);removeEventListener('keydown',onKey);
 R.classList.remove('intro-on');el.classList.add('out');el.setAttribute('aria-hidden','true');   // la web entra con fade-in
 setTimeout(()=>{el.remove();const m=document.querySelector('main');if(m){m.tabIndex=-1;m.focus({preventScroll:true})}},600)};
const onKey=e=>{if(mode==='auto'||(shown&&(e.key==='Enter'||e.key===' ')))finish()};
const show=()=>{if(done||mode==='auto')return;shown=true;btn.classList.add('show');btn.focus({preventScroll:true})};
if(mode!=='auto')reduce?show():(tA=setTimeout(show,2000*INTRO_SPEED));   // el botón aparece al terminar la animación
if(mode==='auto')tB=setTimeout(finish,INTRO_AUTO_CLOSE_MS);
if(mode==='both')tB=setTimeout(finish,INTRO_BOTH_CLOSE_MS);

})();

function tone(f,t='sine',d=0.08,g=0.08){

  if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended')actx.resume();

  gn.gain.setValueAtTime(g,actx.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d);
  o.connect(gn);gn.connect(actx.destination);
  o.start();o.stop(actx.currentTime+d);
 }catch(e){}
}

// ---- micro confetti celebratorio ----
function boomConfetti(){
 const cv=$('#confetti-canvas');if(!cv)return;
 const ctx=cv.getContext('2d');
 cv.width=window.innerWidth;cv.height=window.innerHeight;
 const pts=[];
 const colors=['#5E8BFF','#8FB0FF','#9DB4E0','#7FB0FF','#6B7FD7','#5E8BFF'];
 for(let i=0;i<65;i++){
  pts.push({x:cv.width/2,y:cv.height/2+60,vx:(Math.random()-.5)*14,vy:(Math.random()*-14)-4,c:colors[Math.floor(Math.random()*colors.length)],s:Math.random()*6+4,r:Math.random()*360,vr:(Math.random()-.5)*10});
 }
 let t0=performance.now();
 function step(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  pts.forEach(p=>{
   p.x+=p.vx;p.y+=p.vy;p.vy+=0.35;p.r+=p.vr;
   ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r*Math.PI/180);
   ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);
   ctx.restore();
  });
  if(t-t0<2000)requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height);
 }
 requestAnimationFrame(step);
}

// ---- fuerza del hábito (0-100% Loop algorithm) ----
function habitStrength(id){

 ds.forEach(d=>{

  const done=D(d).h&&D(d).h[id];
  st=st*0.93+(done?7:0);
 });
 return Math.min(100,Math.round(st));
}

// ---- estado de vista

function renderScheduleRows(s){
 const sched=getDaySchedule(s);
 const o=D(s),doneMap=o.schedDone||{};
 const t=nowT(),isToday=s===nowD();
 if(!sched.length){
  return `<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--mut)">
   <i>No hay horarios configurados para este día.</i><br>
   <small style="margin:6px 0 0;display:inline-block">Escribe una hora y actividad abajo para añadir tu primer bloque horario.</small>
  </td></tr>`;
 }
 return sched.map((x,i)=>{
  const isDone=!!doneMap[i];
  const isNow=isToday&&x.t<=t&&(!sched[i+1]||sched[i+1].t>t);
  const cat=x.cat||(x.x.toLowerCase().includes('entren')?'Entreno':x.x.toLowerCase().includes('estudio')?'Estudio':x.x.toLowerCase().includes('cama')?'Descanso':x.x.toLowerCase().includes('comida')?'Salud':'Rutina');
  return `<tr class="${isDone?'row-done':''} ${isNow?'row-current':''}">
   <td style="text-align:center">
    <button class="sheet-chk-btn ${isDone?'on':''}" data-act="sch-tog" data-i="${i}" title="${isDone?'Marcar como pendiente':'Marcar como completado'}">
     ${isDone?'✓':''}
    </button>
   </td>
   <td><b class="sheet-time">${esc(x.t)}</b></td>
   <td class="${isDone?'td-strike':''}">
    <span>${esc(x.x)}</span>
    ${isNow?'<span class="pill-now">AHORA</span>':''}

   <td style="text-align:center">
    <button class="x" data-act="sch-del" data-i="${i}" title="Eliminar bloque horario">×</button>
   </td>
  </tr>`;
 }).join('');
}

function vProBase(){const s=st_(),t=nowD(),tot=diff(s.start,s.end)+1,el=Math.max(0,Math.min(tot,diff(s.start,t)+1));
 let run=0,best=0;for(let d=s.start;d<=s.end&&d<=t;d=add(d,1)){const x=status(d);if(x==='valid'){run++;best=Math.max(best,run)}else if(x!=='saved'&&x!=='skip'&&d<t)run=0}
 const ds=[];for(let d=s.start;d<=s.end&&d<=t;d=add(d,1))ds.push({v:score(d),c:status(d)});
 const wks=[];for(let w=monday(s.start);w<=s.end&&w<=t;w=add(w,7)){const a=wstats(weekDays(w));wks.push({v:a.avg})}
 const pts=[];for(let d=s.start;d<=s.end&&d<=t;d=add(d,1))(D(d).wo||[]).forEach(w=>{if(w.e===PU)pts.push({x:diff(s.start,d)/Math.max(tot-1,1)*290+5,kg:w.kg,r:w.r})});
 const mk=Math.max(30,...pts.map(p=>p.kg)),y=k=>90-k/mk*80;
 return`<section class="card"><h3>Reto</h3><div class="big">${Math.max(0,diff(t,s.end))} días</div><div class="muted">hasta el ${fmt(s.end)}</div><div class="bar" style="margin-top:12px"><div style="width:${el/tot*100}%"></div></div><small style="margin:6px 0 0;display:block">Día ${el} de ${tot}</small></section>

 case'exp-csv':exportCSV();break;

 case'imp':$('#file').click();break;

document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-tab]');if(!b)return;
 if(b.dataset.act)act(b.dataset);else{tab=b.dataset.tab;render();scrollTo(0,0)}});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset;if(!f)return;
 if(f.f){const o=W(cur);o[f.f]=t.type==='number'?(t.value===''?'':+t.value):t.value;auto(cur,f.f);save();refresh()}
 else if(f.w){const o=W(cur);(o.why=o.why||{})[f.w]=t.value;save()}
 else if(f.s){S.settings[f.s]=t.type==='number'?+t.value:t.value;save();const m=$('#smsg'),x=st_(),bad=x.start>x.end||x.adaptEnd<x.start||x.adaptEnd>x.end;if(m)m.textContent=bad?'Revisa las fechas: inicio ≤ fin de Adaptación ≤ fin del reto.':'';if(!bad)side()}
 else if(f.u){S[f.u]=t.type==='number'?+t.value:(t.type==='checkbox'?t.checked:t.value);save();if(f.u==='userName')side()}
 else if(f.wn){S.weeks[wk]=t.value;save()}});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.days)throw 0;if(!confirm('Esto reemplaza los datos actuales. ¿Continuar?'))return;S=j;norm();save();render();alert('Importado')}catch(x){alert('Archivo no válido')}};r.readAsText(f)});
setInterval(()=>{const e=$('#tl');if(tab==='hoy'&&e&&cur===nowD())e.innerHTML=tl(cur)},60000);

if('serviceWorker'in navigator){
 try{
  const swCode=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>clients.claim());self.addEventListener('fetch',e=>{});`;
  const blob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
 }catch(e){}
}
initUI();if(S.ghost)document.body.classList.add('ghost');render();
})();
